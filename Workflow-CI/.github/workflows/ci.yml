name: CI - MLflow Training

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout repo ─────────────────────────────────
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ── 2. Setup Python ──────────────────────────────────
      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # ── 3. Install dependencies ──────────────────────────
      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install mlflow==2.19.0 pandas==2.2.2 scikit-learn==1.4.2 matplotlib==3.8.4

      # ── 4. Run MLflow Project ────────────────────────────
      - name: Run MLflow Project
        working-directory: MLProject
        run: |
          mlflow run . --env-manager=local

      # ── 5. Simpan model path ke env variable ─────────────
      - name: Get Model Path
        working-directory: MLProject
        run: |
          RUN_ID=$(ls mlruns/0 | grep -v meta | head -1)
          echo "MODEL_PATH=MLProject/mlruns/0/$RUN_ID/artifacts/random_forest_model" >> $GITHUB_ENV
          echo "Run ID: $RUN_ID"

      # ── 6. Simpan artifacts ke GitHub ────────────────────
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-artifacts
          path: |
            MLProject/confusion_matrix.png
            MLProject/classification_report.txt
            MLProject/mlruns/

      # ── 7. Set Up Docker Buildx ──────────────────────────
      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 8. Login ke Docker Hub ───────────────────────────
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # ── 9. Copy model ke folder build ────────────────────
      - name: Prepare Docker Context
        run: |
          cp -r ${{ env.MODEL_PATH }} MLProject/model

      # ── 10. Build & Push Docker Image ────────────────────
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: MLProject
          file: MLProject/Dockerfile
          push: true
          tags: safiraputrimayliani/titanic-prediction:latest
